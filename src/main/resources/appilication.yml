spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flq?useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

    #数据库连接池
    hikari:
        minimum-idle: 5
        maximum-pool-size: 20
        idle-timeout: 30000
        pool-name: HikariCP
        max-lifetime: 2000000
        connection-timeout: 30000

async:
  executor:
    thread:
      # 配置核心线程数
      core_pool_size: 16
      # 配置最大线程数
      max_pool_size: 128
      # 配置队列大小
      queue_capacity: 999
      name:
        prefix: async-service-